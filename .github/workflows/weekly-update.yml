name: Weekly leads refresh & deploy

on:
  schedule:
    - cron: "0 18 * * 1"   # every Monday 18:00 UTC = 8:00 AM Hawaii time (HST, no DST)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          pip install -r requirements.txt
      - name: Fetch County data (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: python fetch.py $(date -u -d '-1 year' +%Y) $(date -u +%Y)
      - name: Build site
        run: python build_site.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "permit-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site newsletter
          git diff --cached --quiet || (git commit -m "Weekly data refresh $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
